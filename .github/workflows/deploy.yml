name: Deploy To EC2

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Github Repository 파일 불러오기
        uses: actions/checkout@v4

      - name: JDK 17버전 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: application.yml 파일 만들기 (멀티라인 대응)
        run: |
          cat <<EOF > ./src/main/resources/application.yml
          ${{ secrets.APPLICATION_PROPERTIES }}
          EOF

      - name: gradlew에 실행 권한 부여
        run: chmod +x ./gradlew

      - name: 테스트 및 빌드하기
        run: ./gradlew clean build

      - name: AWS Resource에 접근할 수 있게 AWS credentials 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ap-southeast-2  # ✅ ECR 리전에 맞춤
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: ECR에 로그인하기
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Docker 이미지 생성
        run: docker build -f Dockerfile-prod -t premind-be .

      - name: Docker 이미지에 Tag 붙이기
        run: docker tag premind-be 896823725236.dkr.ecr.ap-southeast-2.amazonaws.com/premind_be:latest

      - name: ECR에 Docker 이미지 Push하기
        run: docker push 896823725236.dkr.ecr.ap-southeast-2.amazonaws.com/premind_be:latest

      - name: SSH로 EC2에 접속하여 Docker 컨테이너 배포
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script_stop: true
          script: |
            mkdir -p /tmp/docker-config
            docker stop premind_be || true
            docker rm premind_be || true
            aws ecr get-login-password --region ap-southeast-2 \
              | docker --config /tmp/docker-config login --username AWS --password-stdin 896823725236.dkr.ecr.ap-southeast-2.amazonaws.com
            docker --config /tmp/docker-config pull 896823725236.dkr.ecr.ap-southeast-2.amazonaws.com/premind_be:latest
            docker run -d \
              --name premind_be \
              -e SPRING_PROFILES_ACTIVE=prod \
              -p 8080:8080 \
              896823725236.dkr.ecr.ap-southeast-2.amazonaws.com/premind_be:latest
